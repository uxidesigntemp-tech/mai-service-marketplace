# Netlify Production Configuration for MAI Service Marketplace
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Header configuration for caching control
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA Fallback: Direct all routes (e.g., /dashboard, /dashboard/professionals, /dashboard/services) to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
